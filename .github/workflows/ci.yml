name: Sparkle CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            c270sparkleteam2/sparkle:latest
            c270sparkleteam2/sparkle:${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891858635640:role/SparkleGitHubActionsRole
          aws-region: ap-southeast-1

      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push'
        shell: bash
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-01cfeb68e8fa7700f \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/deploy.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id i-01cfeb68e8fa7700f || true

          echo "===== Deployment Output ====="

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-01cfeb68e8fa7700f \
            --query "StandardOutputContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-01cfeb68e8fa7700f \
            --query "Status" \
            --output text)

          echo "Deployment Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment completed successfully."