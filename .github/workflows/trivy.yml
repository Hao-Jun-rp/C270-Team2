name: Trivy Security Scan

# Runs a Trivy scan on every push to main and every PR, so vulnerabilities
# and secrets are visible over time instead of only when someone remembers
# to check manually. This is a TRACKING scan, not a gate — it never fails
# the build (exit-code stays 0), it just reports.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy (dependencies + secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: 0          # report only — does not fail the workflow
          output: trivy-report.txt

      - name: Show results in the run summary
        if: always()
        run: |
          echo "## Trivy scan results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30
