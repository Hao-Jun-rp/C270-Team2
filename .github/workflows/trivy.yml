name: Trivy Security Scan

# Two steps, two different jobs:
#   1. Full report (CRITICAL/HIGH/MEDIUM) — always runs, never blocks.
#      This is what shows up in the run Summary + downloadable artifact,
#      so nothing changes about how you track findings over time.
#   2. Critical-only gate — FAILS the workflow if a CRITICAL vulnerability
#      is found. This is the part that actually blocks a merge, matching
#      what's described on the slide.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Full report (dependencies + secrets) — does not block
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: 0
          output: trivy-report.txt

      - name: Show full report in the run summary
        if: always()
        run: |
          echo "## Trivy scan results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

      - name: Critical vulnerability gate — FAILS the build if found
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: 1
