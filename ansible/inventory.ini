# Ansible inventory
#
# The playbook targets a LOCAL Ubuntu 24.04 VM (Multipass / VirtualBox),
# never production. Production is provisioned by hand and deployed to via
# AWS SSM — see docs/DEPLOYMENT_LOG.md.
#
# Replace the address and user below with your VM's.

[sparkle_server]
sparkle-vm ansible_host=192.168.64.10 ansible_user=ubuntu

[sparkle_server:vars]
ansible_python_interpreter=/usr/bin/python3

# Uncomment ONLY if the VM has a real public domain name pointing at it.
# Let's Encrypt cannot issue a certificate for a bare IP address, so on a
# normal local VM these stay commented and the playbook serves over HTTP.
# certbot_domain=your-vm.example.com
# certbot_email=you@example.com
