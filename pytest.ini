# Pytest configuration
#
# WHY testpaths MATTERS HERE:
# `test_db_connection.py` sits in the project root. It is a UTILITY SCRIPT
# (it checks your DATABASE_URL works before seeding), not a test — but its
# filename matches pytest's `test_*.py` pattern, so a plain `pytest` command
# imported it, and its module-level code CONNECTED TO THE REAL DATABASE.
#
# On a laptop with a .env that meant every `pytest` run opened a connection to
# the shared Aiven database, and made the test suite fail whenever Aiven was
# slow or unreachable — failures that had nothing to do with the code.
#
# Restricting collection to the tests/ folder means `pytest` only ever runs
# real, isolated tests against the in-memory database from conftest.py.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quieter output; -q style summary with short tracebacks.
addopts = -q --tb=short
